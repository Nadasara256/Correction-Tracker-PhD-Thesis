*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header .ttl{flex:1;min-width:0}
header h1{font-size:16px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
header .sub{font-size:13px;color:var(--mut)}
.save{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.bad{background:var(--bad)}.dot.wait{background:var(--warn)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
main{max-width:680px;margin:0 auto;padding:12px 12px 24px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--mut);font-size:12px;font-weight:600;min-height:58px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:15px;font-weight:700}
.muted{color:var(--mut)}
.small{font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -12px;padding-left:12px;padding-right:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;min-height:40px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.static{background:var(--soft);display:flex;flex-direction:column;align-items:flex-start;border-radius:12px;padding:8px 12px;font-weight:500;min-height:0}
.chip.static b{font-size:15px}
.chip.static span{font-size:12px;color:var(--mut)}
.chip.static.late b{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.full{width:100%}
.btn.ghost{background:none;border-style:dashed;color:var(--mut)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;margin:18px 4px 8px}
.week{padding:0;overflow:hidden;scroll-margin-top:76px}
.week.now{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.wh{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:60px}
.wh .t{flex:1;min-width:0}
.wh .t b{display:block;font-size:16px;line-height:1.3}
.wh .t span{font-size:13px;color:var(--mut)}
.cnt{font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.tag.now{background:var(--acc);color:var(--acc-ink)}
.tag.next{background:var(--acc-soft);color:var(--acc)}
.tag.late{background:var(--bad-soft);color:var(--bad)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.doing{background:var(--warn-soft);color:var(--warn)}
.tag.blocked{background:var(--bad-soft);color:var(--bad)}
.chev{width:20px;height:20px;flex:none;transition:transform .15s;color:var(--mut)}
.open>.wh .chev,.open>.ph .chev{transform:rotate(90deg)}
.wb{border-top:1px solid var(--line);padding:4px 6px 10px}
.task{display:flex;align-items:flex-start;gap:4px;padding:2px 0}
.cb{flex:none;width:46px;height:46px;border:0;background:none;display:grid;place-items:center}
.cb i{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);display:grid;place-items:center;background:var(--card);transition:all .12s}
.cb i svg{width:16px;height:16px;opacity:0;color:var(--acc-ink)}
.task.done .cb i{background:var(--acc);border-color:var(--acc)}
.task.done .cb i svg{opacity:1}
.task .tt{flex:1;min-width:0;padding:11px 4px 11px 0;cursor:pointer}
.task .tx{font-size:16px;overflow-wrap:anywhere}
.task.done .tx{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.task .nt{font-size:13px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere;white-space:pre-wrap}
.task .nt::before{content:"Note: ";font-weight:700}
.task .ed{flex:none;width:36px;height:46px;display:grid;place-items:center;color:var(--mut);border:0;background:none}
.task .ed svg{width:16px;height:16px}
.wf{display:flex;gap:8px;padding:6px 8px 0;flex-wrap:wrap}
.glance{position:relative;height:22px;border-radius:8px;background:var(--soft);overflow:hidden;margin:12px 0 4px}
.glance .seg{position:absolute;top:0;bottom:0;opacity:.92}
.glance .seg.ph-prep{background:var(--p-prep)}.glance .seg.ph-lab{background:var(--p-lab)}.glance .seg.ph-write{background:var(--p-write)}
.glance .seg.ph-review{background:var(--p-review)}.glance .seg.ph-send{background:var(--p-send)}.glance .seg.ph-after{background:var(--p-after)}
.glance .hol{position:absolute;bottom:0;height:6px;background:repeating-linear-gradient(45deg,var(--card) 0 3px,transparent 3px 6px)}
.glance .today{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);border-radius:2px}
.months{position:relative;height:16px;font-size:11px;color:var(--mut)}
.months span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.warnbox.bad{background:var(--bad-soft);color:var(--bad)}
.warnbox b{font-weight:700}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px;margin-bottom:10px}
.seg2{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.seg2 select{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);min-height:44px;padding:0 4px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.part{padding:0;overflow:hidden;scroll-margin-top:76px}
.ph{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:60px}
.ph .t{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.3}
.pb{border-top:1px solid var(--line);padding:6px 8px 12px}
.pb p.intro{font-size:14px;color:var(--mut);margin:8px 6px}
.pb h4{font-size:14px;margin:14px 6px 2px;color:var(--acc);display:flex;justify-content:space-between;gap:8px}
.pb h4 span{color:var(--mut);font-weight:600;font-size:13px}
.quote{border-left:3px solid var(--acc);margin:8px 6px;padding:6px 10px;background:var(--soft);border-radius:0 8px 8px 0;font-size:15px}
.tbl{overflow-x:auto;margin:8px 6px;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.num{counter-reset:n}
.rs{padding:12px 14px}
.rs .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{font-weight:800;font-size:13px;background:var(--acc-soft);color:var(--acc);border-radius:8px;padding:3px 9px}

  try{
    if(!_ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;_ac=new C();}

      tgt={w:tw,i:tix+(after?1:0)};
      line.style.cssText='display:block;left:'+r.left+'px;width:'+r.width+'px;top:'+((after?r.bottom:r.top)-1.5)+'px';
    }else{
      tgt={w:tw,i:state.weeks[tw].tasks.length};card.classList.add('droptarget');
    }

  function tick(){
    if(done)return;
    var vh=window.innerHeight,sp=0;
    if(last.y<115)sp=-Math.ceil((115-last.y)/5);else if(last.y>vh-150)sp=Math.ceil((last.y-(vh-150))/5);
    if(sp)window.scrollBy(0,Math.max(-24,Math.min(24,sp)));
    target();raf=requestAnimationFrame(tick);
  }
  function finish(commit){
    if(done)return;done=true;cancelAnimationFrame(raf);
    ghost.remove();line.remove();row.classList.remove('dragging');document.body.classList.remove('dragmode');
    if(hi)hi.classList.remove('droptarget');
    var t=tgt;
    if(commit&&t)moveTask(wi,ti,t.w,t.i);
  }
  h.addEventListener('pointermove',function(e){last.x=e.clientX;last.y=e.clientY;});
  h.addEventListener('pointerup',function(){finish(true);});
  h.addEventListener('pointercancel',function(){finish(false);});
  raf=requestAnimationFrame(tick);
}

function glance(t){
  var ws=state.weeks.filter(function(w){return w.start&&w.end&&w.end>=w.start;});
  if(!ws.length)return null;
  var min=ws.reduce(function(a,w){return w.start<a?w.start:a;},ws[0].start);
  var max=ws.reduce(function(a,w){return w.end>a?w.end:a;},ws[0].end);
  var span=diffDays(min,max)+1;
  function pos(d){return diffDays(min,d)/span*100;}
  var card=el('div',{class:'card'});
  card.append(el('h2',{text:'At a glance'}));
  var bar=el('div',{class:'glance'});
  ws.forEach(function(w){bar.append(el('div',{class:'seg ph-'+(w.phase||'prep'),style:'left:'+pos(w.start)+'%;width:'+((diffDays(w.start,w.end)+1)/span*100)+'%',title:w.title}));});
  state.keyDates.filter(function(k){return !k.count&&k.date;}).forEach(function(k){
    var e=k.end||k.date;if(e<min||k.date>max)return;
    var s=k.date<min?min:k.date,en=e>max?max:e;
    bar.append(el('div',{class:'hol',style:'left:'+pos(s)+'%;width:'+((diffDays(s,en)+1)/span*100)+'%',title:k.label}));});
  if(t>=min&&t<=max)bar.append(el('div',{class:'today',style:'left:'+pos(t)+'%'}));
  card.append(bar);
  var mo=el('div',{class:'months'});
  var d=parse(min);d=new Date(d.getFullYear(),d.getMonth()+1,1);
  while(iso(d)<=max){
    mo.append(el('span',{style:'left:'+pos(iso(d))+'%',text:MON[d.getMonth()]}));
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  card.append(mo);
  var lg=el('div',{class:'legend'});
  PHASES.forEach(function(p){lg.append(el('span',null,el('i',{style:'background:var(--p-'+p[0]+')'}),p[1]));});

  lg.append(el('span',null,el('i',{style:'background:var(--ink);width:3px'}),'Today'));
  card.append(lg);
  return card;
}

/* ---------- SETTINGS / BACKUP ---------- */
function backupObj(){return {app:'thesis-corrections-tracker',v:1,exported:new Date().toISOString(),state:state};}
function backupName(){return 'thesis-tracker-backup-'+today()+'.json';}
function downloadBackup(){
  var blob=new Blob([JSON.stringify(backupObj(),null,1)],{type:'application/json'});
  var a=el('a',{href:URL.createObjectURL(blob),download:backupName()});
  document.body.append(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  state.meta.lastBackup=Date.now();save(true);
  SFX.ok();toast('Backup saved to your Downloads folder.');
}
function shareBackup(){
  var f;try{f=new File([JSON.stringify(backupObj(),null,1)],backupName(),{type:'application/json'});}catch(e){return downloadBackup();}
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:'Thesis tracker backup'}).then(function(){state.meta.lastBackup=Date.now();save(true);render();}).catch(function(){});
  }else downloadBackup();
}
function importBackup(file,first){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result),s=o&&o.state?o.state:o;
      if(!s||s.v!==1||!Array.isArray(s.weeks)||!Array.isArray(s.checklist)||!Array.isArray(s.response))throw new Error('bad');
      if(first){state=s;state.ui=state.ui||clone(SEED.ui);SFX.ok();save(true);render();toast('Data imported. You can close and reopen the app any time.');return;}
      confirmSheet('Restore this backup?','This replaces everything now in the app with the backup'+(o.exported?' from '+o.exported.slice(0,10):'')+'. You can undo straight afterwards.','Restore',function(){
        withUndo('Backup restored',function(){state=s;state.ui=state.ui||clone(SEED.ui);});},false);
    }catch(e){toast('That file is not a valid tracker backup.');}
  };
  rd.readAsText(file);
}

/* ---------- progress report (PDF through print) and text summary ---------- */
function pct(d,t){return t?Math.round(d*100/t):0;}
function ownerName(){return (state.meta&&state.meta.owner)||'Tengku Sarah';}
function allRows(){var r=[];state.response.forEach(function(g){r=r.concat(g.rows);});return r;}
function nDone(list){return list.filter(function(x){return x.done;}).length;}
function stCount(rows){var c={todo:0,doing:0,done:0,na:0};rows.forEach(function(r){c[c.hasOwnProperty(r.st)?r.st:'todo']++;});return c;}
function weekTag(w,t){var i=weekInfo(w,t);return i.complete?['Complete','ok']:(i.overdue?['Overdue','bad']:(i.pos==='now'?['Current','now']:['Upcoming','']));}
function cut(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,'')+'…':s;}
function keyDatesSorted(){return state.keyDates.filter(function(k){return k.count;}).slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});}
function dLeft(t,date){var d=diffDays(t,date);return d>0?d+' days left':(d===0?'today':'passed');}

function summaryText(){
  var t=today(),L=[];
  var tl=allTimelineTasks(),cl=allChecklistItems(),rr=allRows();
  var td=nDone(tl),cd=nDone(cl),rd=rr.filter(rowDone).length;
  L.push('PhD thesis corrections: progress report');
  L.push(ownerName()+' (USIM) · as of '+DOW[parse(t).getDay()]+' '+fmtY(t));
  L.push('');
  L.push('OVERALL');
  L.push('• Timeline tasks: '+td+'/'+tl.length+' ('+pct(td,tl.length)+'%)');
  L.push('• Checklist items: '+cd+'/'+cl.length+' ('+pct(cd,cl.length)+'%)');
  L.push('• Examiner comments answered: '+rd+'/'+rr.length+' ('+pct(rd,rr.length)+'%)');
  var kd=keyDatesSorted();
  if(kd.length){L.push('');L.push('KEY DATES');kd.forEach(function(k){L.push('• '+k.label+': '+fmtY(k.date)+' ('+dLeft(t,k.date)+')');});}
  var f=focusWeek(t);
  if(f){
    var w=state.weeks.filter(function(x){return x.id===f.id;})[0],wi=weekInfo(w,t);
    L.push('');L.push((f.kind==='now'?'THIS WEEK':'UP NEXT')+': '+w.title+' ('+range(w.start,w.end)+') '+wi.done+'/'+wi.total);
    var open=w.tasks.filter(function(x){return !x.done;});
    open.slice(0,6).forEach(function(x){L.push('☐ '+cut(x.t,110));});
    if(open.length>6)L.push('… and '+(open.length-6)+' more');
  }
  var od=[];state.weeks.forEach(function(w){if(weekInfo(w,t).overdue)w.tasks.forEach(function(x){if(!x.done)od.push('⚠ '+cut(x.t,110)+' ['+w.title+']');});});
  if(od.length){L.push('');L.push('OVERDUE');od.slice(0,10).forEach(function(s){L.push(s);});if(od.length>10)L.push('… and '+(od.length-10)+' more');}
  L.push('');L.push('TIMELINE BY BLOCK');
  state.weeks.forEach(function(w){var i=weekInfo(w,t);L.push((i.complete?'✔ ':(i.overdue?'⚠ ':'☐ '))+w.title+' ('+range(w.start,w.end)+') '+i.done+'/'+i.total);});
  L.push('');L.push('EXAMINER COMMENTS BY GROUP');
  state.response.forEach(function(g){var c=stCount(g.rows);L.push('• '+g.name+': '+(c.done+c.na)+'/'+g.rows.length+' answered'+(c.doing?', '+c.doing+' in progress':''));});
  L.push('');L.push('CHECKLIST BY PART');
  state.checklist.forEach(function(p){var its=partItems(p);if(its.length)L.push('• '+p.title+': '+nDone(its)+'/'+its.length);});
  return L.join('\n');
}

function rbar(d,t){return el('div',{class:'rbar'},el('i',{style:'width:'+pct(d,t)+'%'}));}
function rtable(cols,rows,cls,numCols){

function plannedPoints(){
  var ws=state.weeks.slice().sort(function(a,b){return a.end<b.end?-1:(a.end>b.end?1:0);}),tot=allTimelineTasks().length,cum=0,pts=[];
  if(!ws.length||!tot)return pts;
  pts.push({d:ws.reduce(function(m,w){return w.start<m?w.start:m;},ws[0].start),p:0});
  ws.forEach(function(w){cum+=w.tasks.length;pts.push({d:w.end,p:pct(cum,tot)});});

function plannedCountBy(t){var n=0;state.weeks.forEach(function(w){if(w.end<t)n+=w.tasks.length;});return n;}
function paceText(){
  var t=today(),tl=allTimelineTasks(),done=nDone(tl),plan=plannedCountBy(t);
  if(!tl.length)return '';
  var diff=done-plan;
  if(plan===0)return done+' of '+tl.length+' timeline tasks done. No block has reached its end date yet, so there is nothing planned to compare with.';
  if(diff>=0)return 'On pace: '+done+' timeline tasks done, '+plan+' planned by today'+(diff>0?' ('+diff+' ahead).':'.');
  return 'Behind by '+(-diff)+' task'+(diff===-1?'':'s')+': '+done+' timeline tasks done against '+plan+' planned by today.';
}
function progressChart(fixed){
  var W=340,H=196,L=34,R=10,T=10,B=26,t=today(),pl=plannedPoints(),pts=chartPoints();
  if(!pl.length)return null;
  var x0=pl[0].d,x1=pl[pl.length-1].d;
  if(pts.length&&pts[0].d<x0)x0=pts[0].d;
  if(t>x1)x1=t;
  var span=Math.max(1,diffDays(x0,x1));
  function X(d){return +(L+(W-L-R)*diffDays(x0,d)/span).toFixed(1);}
  function Y(p){return +(T+(H-T-B)*(1-p/100)).toFixed(1);}
  var C=fixed?{grid:'#d9e2df',txt:'#5b6a67',pl:'#8a9794',today:'#b8892b'}:{grid:'var(--line)',txt:'var(--mut)',pl:'var(--mut)',today:'var(--warn)'};
  var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'ch',role:'img','aria-label':'Progress over time compared with the plan'});
  [0,25,50,75,100].forEach(function(p){
    svg.append(svgEl('line',{x1:L,x2:W-R,y1:Y(p),y2:Y(p),style:'stroke:'+C.grid+';stroke-width:1'}));
    svg.append(svgText(L-5,Y(p)+3.5,p+'%',{'text-anchor':'end',style:'fill:'+C.txt+';font-size:10px'}));
  });
  var m=parse(x0);m=new Date(m.getFullYear(),m.getMonth()+1,1);
  var lastLab=-99;
  while(iso(m)<=x1){
    var xd=X(iso(m));
    svg.append(svgEl('line',{x1:xd,x2:xd,y1:T,y2:H-B,style:'stroke:'+C.grid+';stroke-width:.6;stroke-dasharray:2 3'}));
    if(xd-lastLab>26){svg.append(svgText(xd,H-B+14,MON[m.getMonth()],{'text-anchor':'middle',style:'fill:'+C.txt+';font-size:10px'}));lastLab=xd;}
    m=new Date(m.getFullYear(),m.getMonth()+1,1);
  }
  svg.append(svgEl('polyline',{points:pl.map(function(p){return X(p.d)+','+Y(p.p);}).join(' '),fill:'none',style:'stroke:'+C.pl+';stroke-width:1.6;stroke-dasharray:5 4'}));
  var xt=X(t);
  svg.append(svgEl('line',{x1:xt,x2:xt,y1:T,y2:H-B,style:'stroke:'+C.today+';stroke-width:1.2'}));
  svg.append(svgText(xt,T+8,'Today',{'text-anchor':xt>W-50?'end':'start',dx:xt>W-50?-3:3,style:'fill:'+C.today+';font-size:10px;font-weight:700'}));
  [['rs',CH_COL.rs],['ck',CH_COL.ck],['tl',CH_COL.tl]].forEach(function(s){
    if(pts.length>1)svg.append(svgEl('polyline',{points:pts.map(function(p){return X(p.d)+','+Y(p[s[0]]);}).join(' '),fill:'none',style:'stroke:'+s[1]+';stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round'}));

    if(last)svg.append(svgEl('circle',{cx:X(last.d),cy:Y(last[s[0]]),r:3.6,style:'fill:'+s[1]}));

/* ---------- calendar export (.ics) ---------- */
function icsEsc(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function icsD(s){return s.replace(/-/g,'');}
function icsFold(line){
  var enc=window.TextEncoder?new TextEncoder():null,out=[],cur='',bytes=0,lim=75;
  Array.from(line).forEach(function(ch){
    var b=enc?enc.encode(ch).length:ch.length;
    if(bytes+b>lim){out.push(cur);cur=' ';bytes=1;lim=75;}
    cur+=ch;bytes+=b;
  });
  out.push(cur);return out.join('\r\n');
}
function buildICS(o){
  var t=today(),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Thesis Correction Tracker//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:PhD thesis corrections'];
  var now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  var n=0;
  function alarm(trig,txt){L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(txt),'TRIGGER:'+trig,'END:VALARM');}
  function ev(uid,start,end,summary,desc,alarms){
    L.push('BEGIN:VEVENT','UID:'+uid+'@thesis-tracker','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsD(start),'DTEND;VALUE=DATE:'+icsD(addDays(end||start,1)),'SUMMARY:'+icsEsc(summary));
    if(desc)L.push('DESCRIPTION:'+icsEsc(desc));
    L.push('TRANSP:TRANSPARENT');
    (alarms||[]).forEach(function(a){alarm(a[0],a[1]);});
    L.push('END:VEVENT');n++;
  }
  if(o.keys)state.keyDates.forEach(function(k){
    if(!k.count||(k.end||k.date)<t)return;
    var al=[];
    if(o.remind!=='none')al.push(['-PT15H','Tomorrow: '+k.label]);
    if(o.remind==='extra')al.push(['-P6DT15H','In one week: '+k.label]);
    ev('key-'+k.id,k.date,k.end,'Thesis: '+k.label,k.label+(k.end?' ('+range(k.date,k.end)+')':''),al);
  });
  if(o.blocks)state.weeks.forEach(function(w){
    var i=weekInfo(w,t);
    if(w.end<t||(o.unfinished&&i.complete))return;
    var open=w.tasks.filter(function(x){return !x.done;}),d=open.slice(0,8).map(function(x){return '- '+cut(x.t,100);}).join('\n');
    if(open.length>8)d+='\n… and '+(open.length-8)+' more';
    var al=[];
    if(o.remind!=='none')al.push(['PT8H','Starts today: '+w.title]);
    if(o.remind==='extra')al.push(['PT'+(24*Math.max(0,diffDays(w.start,w.end))+8)+'H','Block ends today: '+w.title]);
    ev('block-'+w.id,w.start<t?t:w.start,w.end,'Thesis: '+w.title,(d?'Still to do:\n'+d:'All tasks done'),al);
  });
  L.push('END:VCALENDAR');
  return {text:L.map(icsFold).join('\r\n')+'\r\n',count:n};
}

  openSheet('Calendar reminders',function(box,close){

}
function actionToTimeline(m,a){
  openSheet('Add to the timeline',function(box,close){
    box.append(el('p',{class:'small muted',style:'margin-bottom:8px',text:'“'+a.t+'”'}));
    var f=focusWeek(today());
    var sel=field(box,'Put it in this block','select',f?f.id:state.weeks[0].id,{options:state.weeks.map(function(w){return [w.id,w.title+' ('+range(w.start,w.end)+')'];})});
    box.append(el('div',{class:'acts'},el('button',{class:'btn pri',text:'Add task',onclick:function(){
      var w=state.weeks.filter(function(x){return x.id===sel.value;})[0];if(!w)return;
      w.tasks.push({id:uid(),t:a.t,done:!!a.done,st:'',note:'From supervisor meeting on '+fmtY(m.date)});
      a.linked=true;state.ui.open[w.id]=true;
      close();save(true);render();toast('Added to “'+w.title+'”.');}}),
      el('button',{class:'btn',text:'Cancel',onclick:close})));
  });
}
function meetSection(root){
  var n=state.meetings.length;
  if(RO&&!n)return;
  var open=isOpen('meet',n>0);
  root.append(el('div',{class:'grp',text:'Supervisor meetings · '+n}));
  var c=el('div',{class:'card'});
  c.append(el('button',{class:'wh',style:'padding:0;min-height:44px','aria-expanded':open?'true':'false',onclick:function(){state.ui.open.meet=!open;save();render();}},
    el('div',{class:'t'},el('b',{text:n?n+' meeting'+(n===1?'':'s'):'No meetings yet'}),el('span',{text:'What was agreed, with action points'})),icon('chev','chev')));
  if(open){
    var body=el('div',{style:'margin-top:8px'});
    state.meetings.slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);}).forEach(function(m){
      var card=el('div',{class:'ent'});
      card.append(el('div',{class:'top'},el('b',null,fmtY(m.date)+(m.who?' · '+m.who:'')),RO?null:el('button',{class:'ed2','aria-label':'Edit meeting',onclick:function(){editMeeting(m);}},icon('pen'))));
      if(m.notes)card.append(el('div',{class:'res',text:m.notes}));
      m.actions.forEach(function(a){
        card.append(el('div',{class:'task'+(a.done?' done':''),style:'padding-left:0'},
          RO?el('div',{class:'cb static'},el('i',null,icon('check'))):el('button',{class:'cb','aria-label':a.done?'Mark not done':'Mark done',onclick:function(){a.done=!a.done;SFX[a.done?'tick':'untick']();save(true);render();}},el('i',null,icon('check'))),
          el('div',{class:'tt ro'},el('div',{class:'tx'},a.t,a.linked?el('span',{class:'tag done',text:'On timeline'}):null)),
          (!RO&&!a.linked)?el('button',{class:'btn sm',text:'+ Timeline',onclick:function(){actionToTimeline(m,a);}}):null));
      });
      body.append(card);
    });
    if(!RO)body.append(el('div',{class:'tools'},el('button',{class:'btn sm',text:'+ Add meeting',onclick:function(){editMeeting();}})));
    c.append(body);
  }
  root.append(c);
}

/* ---------- More tab ---------- */
function moreView(){
  var root=el('div');
  var c=el('div',{class:'card hero'});
  c.append(el('h2',{text:'Progress over time',style:'margin-bottom:6px'}));
  var ch=progressChart(false);
  if(ch){
    c.append(ch,legendEl(),el('p',{class:'small',style:'margin-top:8px',text:paceText()}));
    if(Object.keys(state.hist).length<2)c.append(el('p',{class:'small muted',style:'margin-top:4px',text:'The lines start from the day this feature was added and grow each day you tick things off.'}));
  }else c.append(el('p',{class:'small muted',text:'Add timeline blocks with dates and tasks to see the chart.'}));
  root.append(c);
  if(!RO){
    root.append(el('div',{class:'grp',text:'Share progress and export'}));
    var d=el('div',{class:'card'});
    [['PDF progress report','Overview and full detail for your supervisors',function(){openReport('full');},true],
     ['Examiner response PDF','Landscape table of comments, corrections made and locations',function(){openReport('resp');},false],
     ['Text summary','Short message for WhatsApp or email',function(){textSheet('Progress summary',summaryText(),'Share it to WhatsApp or email, or copy and paste it.','PhD thesis correction progress');},false],
     ['Calendar reminders','Key dates and timeline blocks in your phone calendar',openCalendarExport,false]].forEach(function(b,i){
      d.append(el('div',{style:i?'margin-top:10px':''},el('button',{class:'btn full'+(b[3]?' pri':''),text:b[0],onclick:b[2]}),el('div',{class:'small muted',style:'margin:3px 2px 0',text:b[1]})));
    });
    root.append(d);
  }
  labSection(root);
  meetSection(root);
  return root;
}

/* ---------- search across everything ---------- */
function openSearch(){
  openSheet('Search',function(box,close){
    var inp=el('input',{class:'search',type:'search',placeholder:'Tasks, checklist, comments, lab log, meetings…'});
    var out=el('div',{style:'margin-top:6px'});
    box.append(inp,out);
    function jump(fn){return function(){close();fn();};}
    function run(){
      var raw=inp.value.trim(),q=raw.toLowerCase();out.textContent='';
      if(q.length<2){out.append(el('p',{class:'small muted',text:'Type at least 2 letters to search all four tabs.'}));return;}
      var G=[];
      function has(){return Array.prototype.slice.call(arguments).join(' ').toLowerCase().indexOf(q)>=0;}
      var tl=[];state.weeks.forEach(function(w){w.tasks.forEach(function(x){if(has(x.t,x.note))tl.push({tx:x.t,wh:w.title,fn:function(){state.ui.tab='timeline';state.ui.open[w.id]=true;save();render();setTimeout(function(){var n=document.getElementById('w-'+w.id);if(n)n.scrollIntoView({block:'start'});},60);}});});});
      G.push(['Timeline',tl]);
      var ck=[];state.checklist.forEach(function(p){[p].concat(p.subs).forEach(function(s){sectionLists(s).forEach(function(b){b.items.forEach(function(x){if(has(x.t,x.note))ck.push({tx:x.t,wh:p.title,fn:function(){state.ui.tab='checklist';state.ui.q=raw;state.ui.clPart='ALL';state.ui.hideDone=false;save();render();window.scrollTo(0,0);}});});});});});
      G.push(['Checklist',ck]);
      var rs=[];state.response.forEach(function(g){g.rows.forEach(function(r){if(has(r.no,r.comment,r.action,r.made,r.loc,r.note))rs.push({tx:r.no+': '+r.comment,wh:g.name,fn:function(){state.ui.tab='response';state.ui.rq=raw;state.ui.rsGroup='ALL';state.ui.rsStatus='ALL';save();render();window.scrollTo(0,0);}});});});
      G.push(['Responses',rs]);
      var lb=[];state.lab.forEach(function(e){if(has(e.test,e.batch,e.result,e.file,e.note,e.date))lb.push({tx:e.test+(e.result?': '+e.result:''),wh:'Experiment log · '+fmtY(e.date),fn:function(){state.ui.tab='more';state.ui.open.lab=true;save();render();window.scrollTo(0,0);}});});
      G.push(['Experiment log',lb]);
      var mt=[];state.meetings.forEach(function(m){if(has(m.who,m.notes,m.date,m.actions.map(function(a){return a.t;}).join(' ')))mt.push({tx:(m.notes||m.actions.map(function(a){return a.t;}).join('; ')||'Meeting'),wh:'Meeting · '+fmtY(m.date),fn:function(){state.ui.tab='more';state.ui.open.meet=true;save();render();window.scrollTo(0,0);}});});
      G.push(['Meetings',mt]);
      var total=0;
      G.forEach(function(g){
        if(!g[1].length)return;total+=g[1].length;
        out.append(el('div',{class:'srh',text:g[0]+' · '+g[1].length}));
        g[1].slice(0,6).forEach(function(r){out.append(el('button',{class:'sr',onclick:jump(r.fn)},el('div',{class:'x',text:cut(r.tx,140)}),el('div',{class:'w',text:r.wh})));});
        if(g[1].length>6)out.append(el('p',{class:'small muted',style:'margin:2px 4px 6px',text:(g[1].length-6)+' more. Type more letters to narrow it down.'}));
      });
      if(!total)out.append(el('p',{class:'small muted',text:'Nothing found for “'+raw+'”.'}));
    }
    inp.addEventListener('input',run);run();
    box.append(el('div',{class:'acts',style:'margin-top:8px'},el('button',{class:'btn',text:'Close',onclick:close})));
    setTimeout(function(){inp.focus();},120);
  });
}

/* ---------- backup reminder (every tab) ---------- */
function backupNudge(){
  if(RO||state.empty||!storageOK)return null;
  var m=state.meta,t=today();
  if(m.snoozeUntil&&m.snoozeUntil>t)return null;
  var days=Math.floor((Date.now()-(m.lastBackup||0))/864e5);
  var any=nDone(allTimelineTasks())+nDone(allChecklistItems())+allRows().filter(rowDone).length+state.lab.length+state.meetings.length;
  if(!(m.lastBackup?days>=7:any>0))return null;
  return el('div',{class:'warnbox'},
    el('b',{text:m.lastBackup?'Last backup was '+days+' days ago. ':'No backup yet. '}),
    'Your data lives only on this phone, and phone browsers can clear it.',
    el('div',{class:'acts',style:'margin-top:8px'},
      el('button',{class:'btn sm pri',text:'Back up now',onclick:function(){downloadBackup();render();}}),
      el('button',{class:'btn sm',text:'Remind me in 2 days',onclick:function(){m.snoozeUntil=addDays(today(),2);save(true);render();}})));
}

/* ---------- view-only copy ---------- */
function roBanner(){
  var m=state.meta||{};
  return el('div',{class:'card ro'},icon('eye'),el('div',null,el('b',{text:'View-only progress copy'}),
    el('div',{class:'small muted',text:'Shared by '+(m.owner||'the student')+'. Progress as of '+fmtY(today())+'. This copy cannot be edited and does not update by itself.'})));
}
function snapshotHTML(includeNotes){
  var st=clone(state);
  st.ui={tab:'timeline',theme:'auto',sfx:'off',vol:'med',open:{},hideDone:false,clPart:'ALL',rsGroup:'ALL',rsStatus:'ALL',q:'',rq:''};
  st.meta={lastBackup:0,snapshotDay:today(),snapshotAt:Date.now(),owner:'Tengku Sarah'};
  if(!includeNotes){
    st.lab=[];st.meetings=[];
    st.weeks.forEach(function(w){w.tasks.forEach(function(t){t.note='';});});
    st.checklist.forEach(function(p){[p].concat(p.subs).forEach(function(sc){sc.blocks.forEach(function(b){if(b.k==='list')b.items.forEach(function(i){i.note='';});});});});
    st.response.forEach(function(g){g.rows.forEach(function(r){r.note='';});});
  }
  var doc=document.documentElement.cloneNode(true);
  ['main','nav','layer','snack','gear','srch','today','rptwrap'].forEach(function(id){var n=doc.querySelector('#'+id);if(n)n.textContent='';});
  var sd=doc.querySelector('#seed');if(sd)sd.remove();
  ['#sw','link[rel=manifest]','link[rel=apple-touch-icon]'].forEach(function(q){var n=doc.querySelector(q);if(n)n.remove();});
  var old=doc.querySelector('#snap');if(old)old.remove();
  doc.removeAttribute('data-theme');
  var body=doc.querySelector('body');body.className='';
  var sn=document.createElement('script');sn.type='application/json';sn.id='snap';
  sn.textContent=JSON.stringify(st).replace(/</g,'\\u003c');
  body.insertBefore(sn,doc.querySelector('#app'));
  return '<!DOCTYPE html>\n'+doc.outerHTML;
}
function snapName(){return 'PhD-Thesis-Progress-Tengku-Sarah-'+today()+'.html';}
function downloadSnapshot(inc){
  var blob=new Blob([snapshotHTML(inc)],{type:'text/html;charset=utf-8'});
  var a=el('a',{href:URL.createObjectURL(blob),download:snapName()});
  document.body.append(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  SFX.ok();toast('View-only copy saved to your Downloads folder.');
}
function shareSnapshot(inc){
  var f;try{f=new File([snapshotHTML(inc)],snapName(),{type:'text/html'});}catch(e){return downloadSnapshot(inc);}
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:'PhD thesis correction progress',text:'Progress as of '+fmtY(today())+' (view only)'}).catch(function(){});
  }else downloadSnapshot(inc);
}

/* ---------- first-run welcome (code-only build) ---------- */
function welcomeView(){
  var fi=el('input',{type:'file',accept:'.json,application/json',style:'display:none',onchange:function(e){var f=e.target.files[0];if(f)importBackup(f,true);}});
  var c=el('div',{class:'card hero'});
  c.append(el('h2',{text:'Welcome'}));
  c.append(el('p',{style:'margin:8px 0 10px',text:'This app keeps your thesis-correction plan on this phone only. The app itself holds no thesis content: you load your own data file once.'}));
  var ol=el('ol',{style:'margin:0 0 12px;padding-left:20px'});
  ol.append(el('li',{style:'margin-bottom:6px',text:'Get your private data file onto this phone (send it to yourself by WhatsApp, email or Drive, then download it).'}));
  ol.append(el('li',{text:'Tap the button below and choose the file.'}));
  c.append(ol);
  c.append(el('button',{class:'btn pri full',text:'Import my data file',onclick:function(){fi.click();}}),fi);
  var n=el('div',{class:'card'});
  n.append(el('p',{class:'small muted',text:'You only do this once. After that your ticks, notes and edits are saved on this phone. Already have a backup file from this app? Choose that instead.'}));
  var root=el('div');root.append(c,n);return root;
}

/* ---------- shell ---------- */
var TABS=[['timeline','Timeline','tl'],['checklist','Checklist','ck'],['response','Responses','rs'],['more','More','more']];
function renderNav(){
  var nav=document.getElementById('nav');nav.textContent='';
  TABS.forEach(function(t){
    nav.append(el('button',{class:state.ui.tab===t[0]?'on':'','aria-label':t[1],onclick:function(){if(state.ui.tab!==t[0]){state.ui.tab=t[0];save();render();window.scrollTo(0,0);}}},icon(t[2]),t[1]));
  });
}
function render(){
  state=ensureState(state);
  var y=window.scrollY,tab=state.ui.tab;
  var main=document.getElementById('main');main.textContent='';
  var d=new Date();
  shownDay=today();
  document.getElementById('today').textContent=(RO?'Progress as of ':'')+DOW[parse(shownDay).getDay()]+' '+fmtY(shownDay);
  var v=state.empty?welcomeView():(tab==='checklist'?checklistView():(tab==='response'?responseView():(tab==='more'?moreView():timelineView())));
  if(RO)main.append(roBanner());
  var nz=state.empty?null:backupNudge();if(nz)main.append(nz);
  main.append(v);
  main.append(el('div',{class:'credit sm',text:'© 2026 @nadasara256. All rights reserved.'}));
  if(state.empty)document.getElementById('nav').textContent='';else renderNav();
  setStatus();
  window.scrollTo(0,y);
}
function init(){
  state=loadState();
  applyTheme();
  state=ensureState(state);
  if(!RO&&!state.empty&&!state.hist[today()]){recordHist();save();}
  var sb=document.getElementById('srch');sb.append(icon('search'));sb.addEventListener('click',openSearch);
  var g=document.getElementById('gear');
  if(RO){g.style.display='none';document.getElementById('save').innerHTML='<span class="rotag">View only</span>';document.title='Progress copy: '+document.title;}
  else{g.append(icon('gear'));g.addEventListener('click',openSettings);}
  render();
  if(!RO&&!lastSaved&&storageOK)save(true);
  if(window.matchMedia)try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
  if(!RO&&!storageOK)toast('This browser is not saving changes. Tap the red dot at the top.');
}
window.__tt={get state(){return state;},render:render,today:today};
init();
})();
